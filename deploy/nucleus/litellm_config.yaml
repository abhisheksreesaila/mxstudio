# Optional virtual-key gateway. Bind LiteLLM to loopback; PostgreSQL stores keys.
# Cloud routing is intentionally absent. Add an explicit, reviewed model entry only.
model_list:
  - model_name: nucleus-local
    litellm_params:
      model: openai/nucleus-local
      api_base: http://127.0.0.1:8080/v1
      api_key: os.environ/MXSTUDIO_NUCLEUS_API_KEY
general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  disable_spend_logs: true
litellm_settings:
  request_timeout: 330
  stream_timeout: 300
  turn_off_message_logging: true
  set_verbose: false
