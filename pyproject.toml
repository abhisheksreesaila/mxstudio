[project]
name = "hotfire"
version = "0.2.0"
description = "Hotfire: local models on Modular MAX you can see into and reshape."
requires-python = ">=3.12"

[project.scripts]
hotfire = "hotfire.cli:main"
mst = "hotfire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotfire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 180  # pytest-timeout: a stuck test fails with a traceback naming it, never hangs the suite
