[project]
name = "mxstudio"
version = "0.2.0"
description = "MX Studio: local models on Modular MAX you can see into and reshape."
requires-python = ">=3.12"

[project.scripts]
mst = "mst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
faulthandler_timeout = 120  # a stuck test prints every thread's stack instead of hanging silently
