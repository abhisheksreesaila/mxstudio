<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mxconsole concept D</title>
<style>
@font-face{font-family:Geist;src:url(./geist-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(./geist-mono-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --page:#2e2e33;--chrome:#1f1f23;--chrome-line:#36363c;--chrome-text:#ededef;--chrome-muted:#a1a1aa;--page-text:#f4f4f5;
  --card:#fff;--card-line:#e4e4e7;--card-line-2:#f1f1f3;--text:#0a0a0b;--text-2:#3f3f46;--muted:#71717a;--sunk:#f4f4f5;--canvas:#f5f5f7;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--code:#0d0d10;--code-text:#e4e4e7;--accent:#0078d4;
  --pull:#12a594;--models:#8e4ec6;--network:#00a2c7;--keys:#e09d00;--bench:#e5484d;--logs:#697177;--gateway:#f76b15;--learn:#3e63dd;
  --hover:#fafafa;--hover-2:#f0f0f2;--sel:#eef5fc;--faint:#a1a1aa;--inv:#0a0a0b;--inv-text:#fff;
  --ok-fg:#15803d;--bad-fg:#b91c1c;--warn-fg:#b45309;--port-fg:#7e22ce;--max-fg:#0d7d70;--hf-fg:#9a6a00;
  --sans:Geist,ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --top:48px;
}
/* dark mode: same layout, dark surfaces. Follows the system unless the toggle in the top bar picked one. */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--chrome:#0c0c0e;--chrome-line:#26262b;
  --card:#1a1a1e;--card-line:#2c2c33;--card-line-2:#24242a;--text:#ededef;--text-2:#c2c2ca;--muted:#8c8c96;--sunk:#232328;--canvas:#111113;
  --hover:#212126;--hover-2:#26262c;--sel:#15253a;--faint:#5c5c66;--inv:#ededef;--inv-text:#0a0a0b;
  --ok-fg:#4ade80;--bad-fg:#f87171;--warn-fg:#fbbf24;--port-fg:#c084fc;--max-fg:#2dd4bf;--hf-fg:#f5c451;color-scheme:dark} :root:not([data-theme=light]) .code{box-shadow:inset 0 0 0 1px var(--card-line)}}
:root[data-theme=dark]{--chrome:#0c0c0e;--chrome-line:#26262b;
  --card:#1a1a1e;--card-line:#2c2c33;--card-line-2:#24242a;--text:#ededef;--text-2:#c2c2ca;--muted:#8c8c96;--sunk:#232328;--canvas:#111113;
  --hover:#212126;--hover-2:#26262c;--sel:#15253a;--faint:#5c5c66;--inv:#ededef;--inv-text:#0a0a0b;
  --ok-fg:#4ade80;--bad-fg:#f87171;--warn-fg:#fbbf24;--port-fg:#c084fc;--max-fg:#2dd4bf;--hf-fg:#f5c451;color-scheme:dark}
:root[data-theme=dark] .code{box-shadow:inset 0 0 0 1px var(--card-line)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.grow{flex:1}

/* ---------- top bar: brand, breadcrumb, hardware chip, shared tools ---------- */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:50;background:var(--chrome);border-bottom:1px solid var(--chrome-line);display:flex;align-items:center;gap:12px;padding:0 10px;color:var(--chrome-text)}
.brand{display:flex;align-items:center;gap:9px;font:600 15px/1 var(--sans);color:var(--chrome-text);letter-spacing:-.01em;background:none;border:0;padding:7px 9px;border-radius:7px;flex:none}
.brand:hover{background:#2c2c31}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.brand small{font:400 11px var(--mono);color:var(--chrome-muted);margin-left:2px}
.bc{display:flex;align-items:center;gap:1px;min-width:0;flex:1;overflow:hidden;font-size:13px;padding-left:12px;border-left:1px solid var(--chrome-line);height:24px}
.bc button{background:none;border:0;color:var(--chrome-muted);padding:4px 7px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.bc button:hover{background:#2c2c31;color:#fff}
.bc button.cur{color:var(--chrome-text);font-weight:500;cursor:default;background:none}
.bc svg{width:12px;height:12px;opacity:.45;flex:none}
.hwchip{display:flex;align-items:center;gap:8px;background:#2a2a2f;border:1px solid var(--chrome-line);border-radius:7px;padding:5px 9px;font:12px var(--mono);color:var(--chrome-muted);flex:none;white-space:nowrap}
.hwchip:hover,.hwchip[aria-expanded=true]{border-color:#55555c;color:var(--chrome-text)}
.hwchip b{color:var(--chrome-text);font-weight:500}
.hwchip svg{width:14px;height:14px}
.vbar{height:8px;border-radius:4px;background:#3a3a40;display:flex;overflow:hidden;gap:1px}
.vbar span{height:100%;transition:width .6s var(--ease)}
.hwchip .vbar{width:64px;height:6px}
.hwpop{position:fixed;top:calc(var(--top) + 6px);right:150px;width:360px;max-width:calc(100vw - 20px);background:var(--card);color:var(--text);border:1px solid var(--card-line);border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);padding:14px 16px;z-index:60;animation:fadeUp .2s var(--ease) both}
.hwpop[hidden]{display:none}
.hwpop .vbar{height:12px;background:var(--sunk);margin:8px 0 6px}
.legend{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:5px 8px;font:12px var(--mono);color:var(--text-2);align-items:center}
.legend i{width:8px;height:8px;border-radius:2px}
.tnav{display:flex;align-items:center;gap:2px;flex:none}
.tn svg{color:var(--hue,currentColor)}
.tn{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--chrome-muted);padding:7px 10px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.tn:hover{background:#2c2c31;color:var(--chrome-text)}
.tn.on{background:#34343b;color:var(--chrome-text);box-shadow:inset 0 -2px 0 var(--hue,var(--accent))}
.tn.icon{padding:8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #16a34a33;flex:none}
.concept{font:500 10.5px var(--mono);color:#6e6e78;border:1px solid var(--chrome-line);border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none}

/* ---------- the journey: blades docked side by side ---------- */
.journey{position:fixed;top:var(--top);left:0;right:0;bottom:0;display:flex;overflow-x:auto;overflow-y:hidden;background:var(--canvas)}
.blade{flex:none;display:flex;flex-direction:column;height:100%;background:var(--card);border-right:1px solid var(--card-line);min-width:0;color:var(--text);transition:width .26s var(--ease),min-width .26s var(--ease)}
.blade.enter{animation:bladeIn .26s var(--ease) both}
@keyframes bladeIn{from{opacity:0;transform:translateX(24px)}}
.blade.last{border-right:0}
.bh{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--card-line);flex:none;min-height:60px;background:var(--card)}
.bh .tt{min-width:0;flex:1}
.bh .t{font-weight:600;font-size:16px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.bh .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .count{font:500 12px var(--mono);color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 8px}
.bb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;container-type:inline-size}
.blade.side .bh,.blade.rail .bh{cursor:pointer}
.blade.narrow .rwrap{grid-template-columns:minmax(0,1fr)}
.blade.narrow .rmenu{display:none}
.blade.side .bh:hover{background:var(--hover)}
/* rail: a blade folded to a strip; click it to come back to it */
.blade.rail{background:var(--hover);cursor:pointer}
.blade.rail:hover{background:var(--hover-2)}
.blade.rail .bh{flex-direction:column;align-items:center;padding:12px 0;gap:12px;border-bottom:0;background:none;min-height:0}
.blade.rail .tt{writing-mode:vertical-rl;flex:none}
.blade.rail .t{font-size:13px;font-family:var(--mono)}
.blade.rail .s,.blade.rail .tools,.blade.rail .x,.blade.rail .count{display:none}
.blade.rail:not(.b-home) .bb{display:none}
.pad{padding:18px 20px 32px}
.h3{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h3 .r{margin-left:auto;text-transform:none;letter-spacing:0}

/* ---------- home ---------- */
.b-home .bb{background:var(--canvas)}
.hbody{padding:18px 22px 40px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font:600 22px var(--mono);letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .vbar{background:var(--sunk);margin-top:9px}
.attn{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bad) 4%,transparent);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad-fg);border-radius:10px;padding:8px 10px 8px 12px;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.attn .btn{height:28px}
.homebar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.filter{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--card-line);border-radius:7px;padding:0 10px;color:var(--muted);background:var(--card);width:min(320px,100%)}
.filter input{border:0;outline:0;font:13px var(--sans);flex:1;color:var(--text);background:none;min-width:0}
.filter:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,120,212,.12)}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--card-line);padding:2px;border-radius:8px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--sunk);color:var(--text)}
.seg svg{width:14px;height:14px}
/* compact list when a model is open next to it */
.mrow{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--card-line-2);background:var(--card);text-align:left}
.mrow:hover{background:var(--hover)}
.mrow.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .nm{font:600 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sub{font:11.5px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.mrow .tp{font:500 12px var(--mono);color:var(--text-2);text-align:right}
.mrow .tp small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border:0;background:none;color:var(--accent);font-weight:500;font-size:13px}
.addrow:hover{background:var(--sel)}
.rdots{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 12px}
.rdot{width:30px;height:30px;border-radius:7px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);display:grid;place-items:center}
.rdot i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rdot.on{box-shadow:inset 0 0 0 2px var(--accent)}
.rdot.plus{color:var(--accent)}

/* ---------- model resource blade ---------- */
.rwrap{display:grid;grid-template-columns:184px minmax(0,1fr);height:100%}
.rmenu{border-right:1px solid var(--card-line);padding:8px;overflow-y:auto;background:var(--card)}
.rmenu .grp{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
.rmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;color:var(--text-2);text-align:left;white-space:nowrap}
.rmenu button svg{color:var(--h,var(--muted))}
.rmenu button:hover{background:var(--sunk)}
.rmenu button.on{background:var(--sel);color:var(--text);font-weight:500;box-shadow:inset 2px 0 0 var(--accent)}
.rmenu button .chev{margin-left:auto;width:13px;height:13px;opacity:.4;color:var(--muted)}
.rcontent{overflow-y:auto;background:var(--canvas);container-type:inline-size;min-width:0}
.cmdbar{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--card-line);background:var(--card);flex-wrap:wrap;position:sticky;top:0;z-index:2}
.cb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 9px;border-radius:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.cb:hover{background:var(--sunk);color:var(--text)}
.cb svg{width:14px;height:14px}
.cb svg{color:var(--h,currentColor)}
.cb[style*="--h"]{color:color-mix(in srgb,var(--h) 70%,var(--text))}
.cb.danger{color:var(--bad-fg)}
.cb.hl{font-weight:500}
.cbsep{width:1px;background:var(--card-line);margin:4px 4px}
.ovgrid{display:grid;gap:12px;padding:14px 16px 30px}
.box{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:14px;min-width:0}
.ess{display:grid;grid-template-columns:112px minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.ess dt{color:var(--muted)}
.ess dd{margin:0;font:12.5px var(--mono);overflow-wrap:anywhere;min-width:0}
.ess dd button.lnk{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:2px}
@container (min-width:720px){
  .ovgrid{grid-template-columns:1fr 1fr}
  .ovgrid .span{grid-column:1/-1}
}
@container (min-width:900px){ .ess{grid-template-columns:112px minmax(0,1fr) 112px minmax(0,1fr)} }
.secsum{display:flex;align-items:center;gap:12px}
.secsum .tx{flex:1;min-width:0}
.secsum b{display:block;font-weight:600}
.secsum span{font-size:12.5px;color:var(--muted)}

/* ---------- add a model: full setup screen ---------- */
.b-add .bb,.b-notebook .bb{overflow:hidden;display:flex;flex-direction:column}
.findwrap{overflow-y:auto;flex:1;background:var(--canvas)}
.find{max-width:980px;margin:0 auto;padding:22px 24px 40px}
.find .search{background:var(--card);height:44px}
.find .search input{font-size:15px}
.reslist{background:var(--card);border:1px solid var(--card-line);border-radius:10px;overflow:hidden;margin-top:14px}
.reslist .res:last-child{border-bottom:0}
.setup{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.setup .sl{overflow-y:auto;padding:22px 28px 40px}
.setup .sr{background:var(--code);display:flex;flex-direction:column;min-height:0;padding:14px 0 0}
.setup .sr .lbl{color:#71717a;padding:0 16px 8px;display:flex;gap:8px}
.setup .sr .log{flex:1;height:auto;margin:0;border-radius:0;padding:4px 16px 16px}
.setup .runhead{margin-bottom:6px}
.setup .stg{padding:12px 0}
.setup .stg .n{font-size:15px}
.setup .stg::before{top:36px}
@container (max-width:900px){
  .setup{display:block;overflow-y:auto}
  .setup .sl{overflow:visible}
  .setup .sr{height:300px}
}
.backlink{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-size:13px;padding:0;margin-bottom:12px}
.backlink svg{width:13px;height:13px}

/* tables inside blades */
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--card-line);background:var(--hover);white-space:nowrap}
.dtable td{padding:9px 12px;border-bottom:1px solid var(--card-line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.dtable tr:last-child td{border-bottom:0}
.dtable .num{font-family:var(--mono);font-size:12.5px}

/* ---------- components (shared with A, B and C) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#1a9cff}
.btn.dark{background:var(--inv);color:var(--inv-text)}
.btn.dark:hover{opacity:.88}
.btn.ghost{background:var(--card);color:var(--text-2);border-color:var(--card-line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.port{background:var(--models);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.cli{font:11.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cli::before{content:"$";color:var(--faint)}
/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);color:var(--text);border-radius:12px;padding:13px 14px 11px;border:0;text-align:left;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .15s;cursor:pointer;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(0,0,0,.45)}
.card.sel{box-shadow:0 0 0 2px var(--accent)}
.card .r{display:flex;align-items:center;gap:8px;min-width:0}
.mdot{width:9px;height:9px;border-radius:50%;background:var(--mc);flex:none}
.card .nm{font:600 14px var(--mono);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{margin-left:auto;font:500 12px var(--mono);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--text-2)}
.sd{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;position:relative}
.state.running .sd{background:var(--ok);animation:pulse 2s infinite}
.state.starting{color:var(--warn)}.state.starting .sd{background:none;border:2px solid #fcd34d;border-top-color:var(--warn);width:10px;height:10px;animation:spin .8s linear infinite}
.state.crashed{color:var(--bad)}.state.crashed .sd{background:var(--bad)}
.state.idle{color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.acc{font:500 11px var(--mono);display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.acc{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent)}
.acc.local{color:var(--muted)}
.acc.secure{color:var(--ok-fg)}
.acc svg{width:11px;height:11px}
.ep{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tps{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.tps .n{font:600 18px var(--mono);letter-spacing:-.02em;white-space:nowrap}
.tps .n small{font-size:11px;color:var(--muted);font-weight:400}
.tps svg{flex:none}
.card .foot{border-top:1px solid var(--card-line-2);padding-top:8px;display:flex;align-items:center;gap:10px;font:11.5px var(--mono);color:var(--muted)}
.share{display:flex;align-items:center;gap:6px;white-space:nowrap}
.share .tr{width:44px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.share .tr i{display:block;height:100%;background:var(--mc)}
.card .foot .cli{margin-left:auto}
.crashnote{font:12px var(--mono);color:var(--bad-fg);border-left:2px solid var(--bad);padding:2px 0 2px 8px}
.card.add{background:transparent;border:1px dashed #55555c;color:#a1a1aa;align-items:center;justify-content:center;min-height:150px}
.card.add::before{display:none}
.card.add:hover{color:var(--page-text);border-color:#8a8a92;box-shadow:none}
.card.new{animation:popIn .7s cubic-bezier(.2,.9,.25,1.15) both}
.card.new::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;animation:flash 1.6s ease-out both}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--ok),0 0 0 0 rgba(22,163,74,.6)}50%{box-shadow:inset 0 0 0 2px var(--ok),0 0 0 14px rgba(22,163,74,0)}100%{box-shadow:inset 0 0 0 0 transparent}}
.card.wake{animation:wake 1.2s ease}
@keyframes wake{30%{box-shadow:0 0 0 3px rgba(22,163,74,.55)}}

/* ---------- list ---------- */
.table{background:var(--card);color:var(--text);border-radius:12px;overflow:hidden}
.table table{width:100%;border-collapse:collapse;table-layout:fixed}
.table th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--card-line);background:var(--hover)}
.table td{padding:9px 12px;border-bottom:1px solid var(--card-line-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table tr.row{cursor:pointer;transition:background .12s}
.table tr.row:hover{background:var(--hover)}
.table tr.row:last-child td{border-bottom:0}
.table tr.new{animation:rowFlash 1.6s ease}
@keyframes rowFlash{0%,40%{background:color-mix(in srgb,var(--ok) 18%,transparent)}}
.table td.nm{font:600 13px var(--mono)}
.table .num{font-family:var(--mono);font-size:12.5px}

.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:var(--h);box-shadow:inset 0 0 0 1.25px color-mix(in srgb,var(--h) 42%,transparent)}
.tools{display:flex;gap:6px;align-items:center}
.speed{background:var(--card);border:1px solid var(--card-line);color:var(--muted);border-radius:6px;padding:3px 8px;font:11px var(--mono)}
.speed.on{background:var(--inv);color:var(--inv-text);border-color:var(--inv)}
.x{border:0;background:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--sunk);color:var(--text)}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.sect{padding:14px 16px;border-bottom:1px solid var(--card-line-2)}
.sect:last-child{border-bottom:0}
.sect h3{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sect h3 .state{margin-left:0;text-transform:none;letter-spacing:0;font-size:12.5px}
.sect h3 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.fade{animation:fadeUp .35s var(--ease) both}
@keyframes fadeUp{from{transform:translateY(6px);opacity:0}}
.ib{border:0;background:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--sunk);color:var(--text)}
.ib svg{width:14px;height:14px}

.urlrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--card-line);border-radius:9px;font:13px var(--mono);min-width:0}
.urlrow .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlrow .tag{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.urlrow.secure{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 5%,transparent)}
.urlrow.secure .tag{color:var(--ok-fg)}
.code{background:var(--code);color:var(--code-text);font:12px/1.6 var(--mono);border-radius:9px;padding:12px 14px;position:relative;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.code .cp{position:absolute;top:6px;right:6px;color:#a1a1aa;background:#1a1a1f;border:1px solid #2c2c33;border-radius:6px;font:11px var(--mono);padding:3px 8px;display:flex;gap:5px;align-items:center}
.code .cp:hover{color:#fff}
.code .cp svg{width:12px;height:12px}
.code .s{color:#86efac}.code .c{color:#71717a}.code .kw{color:#c4b5fd}.code .f{color:#7dd3fc}
.keyrow{display:flex;align-items:center;gap:6px;margin-top:10px;font:12.5px var(--mono);color:var(--text-2)}
.keyrow .kval{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.keyrow .lbl{color:var(--muted);margin-right:4px;font-family:var(--sans);font-size:12.5px}
.sect .cli{margin-top:10px}
/* secure widget */
.secbox{border:1px solid var(--card-line);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.secbox.done{border-color:rgba(22,163,74,.4)}
.secbox .hd{display:flex;align-items:center;gap:10px}
.secbox .hd .tx{flex:1;min-width:0}
.secbox .hd b{font-weight:600;display:block}
.secbox .hd span{font-size:12.5px;color:var(--muted)}
.secsteps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.secsteps li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);transition:color .2s;min-width:0}
.secsteps li .m{margin-left:auto;font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.secsteps li.active{color:var(--text)}
.secsteps li.done{color:var(--text-2)}
.flashok{animation:okflash 1.3s ease-out}
@keyframes okflash{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}60%{box-shadow:0 0 0 12px rgba(22,163,74,0)}}

/* ring timeline (from B) + meta (from A) */
.ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--card-line);display:grid;place-items:center;background:var(--card);position:relative;z-index:1;transition:all .25s;flex:none;color:var(--faint)}
.ring svg{width:13px;height:13px;stroke-width:2.4}
.secsteps .ring{width:18px;height:18px}
.secsteps .ring svg{width:10px;height:10px}
.active>.ring{border-color:var(--hue,var(--accent));border-top-color:transparent;animation:spin .8s linear infinite}
.done>.ring{border-color:var(--ok);color:var(--ok)}
.fail>.ring{border-color:var(--bad);color:var(--bad);animation:shake .4s}
.fixed>.ring{border-color:var(--warn);color:var(--warn)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.runhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.runhead .cmd{font:12.5px var(--mono);color:var(--pull)}
.runhead .total{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.stages{list-style:none;margin:0;padding:0}
.stg{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;position:relative}
.stg::before{content:"";position:absolute;left:11px;top:33px;bottom:-9px;width:2px;background:var(--card-line)}
.stg:last-child::before{display:none}
.stg.done::before,.stg.fixed::before{background:var(--ok)}
.stg .n{font-weight:500;align-self:center;color:var(--muted);transition:color .2s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg.active .n,.stg.done .n,.stg.fail .n,.stg.fixed .n{color:var(--text)}
.stg .meta{align-self:center;font:11.5px var(--mono);color:var(--muted);display:flex;gap:10px;white-space:nowrap}
.stg .meta .el{min-width:46px;text-align:right;color:var(--faint)}
.stg .d{grid-column:2/4;font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg.fail .d{color:var(--bad-fg)}.stg.fixed .d{color:var(--warn-fg)}
.stg .bar{grid-column:2/4;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:4px;opacity:0;transition:opacity .2s}
.stg.active .bar,.stg.done .bar,.stg.fail .bar,.stg.fixed .bar{opacity:1}
.stg .bar i{display:block;height:100%;width:0;background:var(--hue,var(--accent))}
.stg.done .bar i{background:var(--ok)}.stg.fail .bar i{background:var(--bad)}.stg.fixed .bar i{background:var(--warn)}
.skill{font:500 10.5px var(--mono);color:var(--gateway);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent);padding:1px 6px;border-radius:4px;margin-left:6px}
.logtoggle{background:none;border:0;color:var(--text-2);font:12px var(--mono);display:flex;align-items:center;gap:8px;padding:4px 0;margin-top:8px;max-width:100%;min-width:0}
.logtoggle svg{transition:transform .2s}
.logtoggle[aria-expanded=true] svg{transform:rotate(90deg)}
.logtoggle>span:not(.last){white-space:nowrap;flex:none}
.logtoggle .last{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.log{background:var(--code);color:#a1a1aa;font:11.5px/1.6 var(--mono);border-radius:9px;padding:10px 12px;height:200px;overflow-y:auto;margin-top:8px}
.log[hidden]{display:none}
.log div{white-space:pre-wrap;word-break:break-word}
.log .t{color:#4a4a52}.log .k{display:inline-block;min-width:6ch;color:#71717a}
.log .er{color:#f87171}.log .okl{color:#4ade80}.log .wl{color:#fbbf24}.log .b{color:#60a5fa}
.log.tall{height:calc(100% - 4px);min-height:300px}

/* add panel: search */
.search{display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--card-line);border-radius:8px;padding:0 10px;color:var(--muted)}
.search input{border:0;outline:0;font:14px var(--mono);flex:1;color:var(--text);background:none;min-width:0}
.search:focus-within{border-color:var(--pull);box-shadow:0 0 0 3px rgba(18,165,148,.15)}
.fseg{display:flex;gap:2px;margin-top:10px;background:var(--sunk);padding:2px;border-radius:7px;width:max-content}
.fseg button{border:0;background:none;padding:4px 10px;border-radius:5px;font-size:12px;color:var(--muted)}
.fseg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.res{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 12px;padding:10px 16px;border-bottom:1px solid var(--card-line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;transition:background .12s}
.res:hover,.res:focus-visible{background:var(--hover)}
.res .src{grid-row:1/3;font:600 10px var(--mono);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;align-self:center}
.res .src{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent)}
.src.max{color:var(--max-fg)}
.src.hf{color:var(--hf-fg)}
.res .nm{font:500 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .mt{font-size:12px;color:var(--muted);grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .fits{grid-row:1/3;grid-column:3;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fit{font:500 11px var(--mono);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent);padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fit::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fit.ok{color:var(--ok-fg)}.fit.tight{color:var(--warn-fg)}.fit.no{color:var(--bad-fg)}
.fit.port{color:var(--port-fg)}.fit.inst{color:var(--muted)}
.res .sz{font:11px var(--mono);color:var(--muted)}
.empty{color:var(--muted);font:12.5px var(--mono);padding:14px 16px}

.notice{border:1px solid var(--card-line);border-radius:12px;padding:16px;animation:fadeUp .35s var(--ease) both}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 4%,transparent)}
.notice.port{border-color:color-mix(in srgb,var(--models) 50%,transparent);background:color-mix(in srgb,var(--models) 4%,transparent)}
.notice .lab{display:flex;gap:8px;align-items:center;font:12px var(--mono);margin-bottom:8px}
.notice.warn .lab{color:var(--warn-fg)}.notice.port .lab{color:var(--port-fg)}
.notice h4{margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.notice p{margin:0 0 12px;color:var(--text-2);font-size:13px}
.meter{display:grid;grid-template-columns:86px minmax(0,1fr) 60px;gap:10px;align-items:center;font:12px var(--mono);color:var(--text-2);margin:6px 0}
.meter .tr{height:8px;border-radius:4px;background:var(--card);border:1px solid var(--card-line);overflow:hidden}
.meter .tr i{display:block;height:100%}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sg{border:1px solid var(--card-line);background:var(--card);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.sg:hover{border-color:var(--faint)}
.sg .t{font:600 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .d{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0 0 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:12.5px var(--mono);overflow-wrap:anywhere}

/* ready card */
.ready{margin-top:14px;border-radius:12px;padding:16px;position:relative;border:1px solid var(--card-line);animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
.ready::before{content:"";position:absolute;inset:-1px;border-radius:12px;pointer-events:none;animation:flash 1.6s ease-out both}
@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.97)}100%{opacity:1;transform:none}}
.ready .pill{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--ok-fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent);padding:3px 8px;border-radius:999px}
.ready h4{margin:8px 0 12px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.ready .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

/* details */
.metrics{display:grid;grid-template-columns:1.4fr 1fr 1fr;border:1px solid var(--card-line);border-radius:10px;overflow:hidden}
.metrics>div{padding:10px 12px;border-left:1px solid var(--card-line-2);min-width:0}
.metrics>div:first-child{border-left:0}
.lbl{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.metrics .v{font:600 17px var(--mono);margin-top:2px;letter-spacing:-.02em;white-space:nowrap}
.metrics .v small{font-size:11px;color:var(--muted);font-weight:400}
.fitbar{position:relative;height:10px;background:var(--sunk);border-radius:5px;display:flex;overflow:hidden;gap:1px}
.fitbar i{display:block;height:100%}
.fitcap{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted);margin-top:6px;gap:10px}
.acts-list{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:28px minmax(0,1fr) auto 16px;align-items:center;gap:10px;padding:9px 16px;border:0;border-bottom:1px solid var(--card-line-2);background:none;text-align:left;width:100%;transition:background .12s}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--hover)}
.arow.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.arow .lb{font-weight:500;font-size:13.5px}
.arow .lb small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.arow .cli{max-width:180px}
.arow .chev{color:var(--faint)}
.arow.danger .lb{color:var(--bad-fg)}
.panel.back .arow .cli{display:none}

/* learn */
.cell{border:1px solid var(--card-line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.cell .md{padding:10px 12px;font-size:13px;line-height:1.55;color:var(--text-2)}
.cell .md b{color:var(--text)}
.cell .in{display:grid;grid-template-columns:36px minmax(0,1fr)}
.cell .in .p{font:11px var(--mono);color:var(--muted);padding:12px 0 0 8px}
.cell .in .code{border-radius:0;margin:0}
.cell .out{font:12px var(--mono);padding:8px 12px 8px 44px;border-top:1px solid var(--card-line-2);color:var(--text-2);white-space:pre-wrap;background:var(--hover)}
.cell .out.wait{color:var(--faint)}
.arch{display:flex;flex-direction:column;gap:4px;font:12px var(--mono);margin-top:8px}
.arch div{padding:6px 9px;border-radius:6px;background:var(--sunk);border-left:3px solid var(--learn);display:flex;justify-content:space-between;gap:10px}
.arch div span{color:var(--muted);white-space:nowrap}
.arch.ssm div{border-left-color:var(--models)}

/* bench */
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:120px minmax(0,1fr) 62px;align-items:center;gap:10px;font:12.5px var(--mono)}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brow .tr{height:16px;border-radius:4px;background:var(--card-line-2);overflow:hidden}
.brow .tr span{display:block;height:100%;border-radius:4px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.brow .v{text-align:right;color:var(--text-2)}
.brow.me .nm{font-weight:600}
.brow.me .tr{box-shadow:0 0 0 1px var(--text) inset}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--chrome);color:var(--chrome-text);border:1px solid var(--chrome-line);padding:9px 14px;border-radius:8px;font:12.5px var(--mono);opacity:0;transition:all .25s;z-index:95;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .active>.ring{border-top-color:var(--hue,var(--accent))}
}
/* notebook */
.kchip{font:500 11.5px var(--mono);display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;color:var(--ok-fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 40%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kchip .sd{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.kchip.off{color:var(--muted)}
.kchip.off .sd{background:var(--faint)}
.nbbody{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr) 290px}
.nbtoc{border-right:1px solid var(--card-line);padding:16px 10px;overflow-y:auto;background:var(--card);display:flex;flex-direction:column;gap:2px}
.nbtoc .lbl{padding:0 10px 8px}
.nbtoc button{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;color:var(--text-2);font-size:13px}
.nbtoc button:hover{background:var(--sunk);color:var(--text)}
.nbtoc .num{font:11px var(--mono);color:var(--muted)}
.nbmain{overflow-y:auto;padding:24px clamp(16px,3vw,40px) 80px}
.nbmain .inner{max-width:880px;margin:0 auto}
.nbside{border-left:1px solid var(--card-line);padding:16px;overflow-y:auto;background:var(--card)}
.nbcell{background:var(--card);border:1px solid var(--card-line);border-radius:10px;margin-bottom:14px;overflow:hidden;scroll-margin-top:16px}
.nbcell .md{padding:16px 18px 10px;font-size:14px;line-height:1.6;color:var(--text-2)}
.nbcell .md h2{font-size:17px;font-weight:600;margin:0 0 6px;color:var(--text);letter-spacing:-.015em}
.nbcell .md p{margin:0 0 8px;max-width:72ch}
.nbcell .md b{color:var(--text)}
.nbcell .in{display:grid;grid-template-columns:56px minmax(0,1fr);border-top:1px solid var(--card-line-2)}
.nbcell .in .p{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font:11.5px var(--mono);color:var(--muted)}
.nbcell .in .code{border-radius:0;margin:0;font-size:12.5px;padding:14px 16px}
.nbcell .out{font:12.5px var(--mono);padding:10px 16px 12px 72px;border-top:1px solid var(--card-line-2);color:var(--text);white-space:pre-wrap;background:var(--hover)}
.nbcell .out.wait{color:var(--faint)}
.b-notebook .nbbody{flex:1;min-height:0}
@container (max-width:1100px){ .nbbody{grid-template-columns:190px minmax(0,1fr)} .nbside{display:none} }
@container (max-width:720px){ .nbbody{grid-template-columns:minmax(0,1fr)} .nbtoc{display:none} }
.b-home .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

  $('.ring', li).innerHTML = st==='done' ? ic('check') : st==='fail' ? ic('x') : st==='fixed' ? ic('wrench') : st==='active' ? '' : ic('dot');
}
function runStage(root, p, tok, i, s, t0){
  return new Promise(resolve => {
    const li = $(`.stg[data-i="${i}"]`, root); setRing(li, 'active');
    if (s.active) $('.d', li).textContent = s.active;
    const lines = s.log || [], stopAt = s.failAt || 1;
    let emitted = 0, last = performance.now(), acc = 0;
    function frame(now){
      if (!p.alive || tok !== p.tok) return resolve(null);
      acc += (now - last) * (fast ? 4 : 1); last = now;
      const pr = Math.min(acc / s.dur, stopAt);
      $('.bar i', li).style.width = (pr*100) + '%';
      $('.el', li).textContent = fmtT(acc);
      const tot = $('.total', root); if (tot) tot.textContent = fmtT(performance.now() - t0);
      if (s.gb) $('.bps', li).textContent = `${fmtB(s.gb*pr)} / ${fmtB(s.gb)} · ${Math.round(s.rate*(0.85+Math.random()*0.3))} MB/s`;
      else if (s.meter) $('.bps', li).textContent = s.meter(pr);
      const want = Math.floor((pr/stopAt) * lines.length);
      while (emitted < want) logLine(root, s.tag, lines[emitted++]);
      if (pr >= stopAt) {
        if (s.failAt) { setRing(li, 'fail'); $('.d', li).textContent = s.failNote; (s.failLog||[]).forEach(l => logLine(root, s.tag, '!'+l)); $('.bps', li).textContent = ''; return setTimeout(() => resolve('fail'), fast ? 150 : 700); }
        setRing(li, 'done'); $('.d', li).textContent = s.doneNote || ''; $('.bps', li).textContent = s.doneMeta || '';
        return resolve('ok');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- blades: docked side by side; closing one closes everything to its right ---------- */
const stack = [];
const J = $('#journey');
const BLADES = {};
function push(type, opts={}, at=stack.length-1){
  truncate(at + 1, true);
  const b = {type, opts, alive:true, tok:0};
  const def = BLADES[type](b);
  Object.assign(b, {title:def.title, crumb:def.crumb || def.title, wide:!!def.wide, side:def.side || 600, narrow:def.narrow || 0, min:def.min || 520});
  const el = document.createElement('section');
  el.className = `blade b-${type} enter`; el.setAttribute('aria-label', def.crumb || type);
  el.innerHTML = `<header class="bh">${sq(def.icon, def.hue)}<div class="tt"><div class="t"></div><div class="s"></div></div><div class="tools">${def.tools||''}</div>${type==='home'?'':`<button class="x" aria-label="Close" title="Close (Esc)">${ic('x')}</button>`}</header><div class="bb"></div>`;
  b.el = el;
  $('.t', el).innerHTML = def.title; $('.s', el).innerHTML = def.sub || '';
  if (type !== 'home') $('.x', el).onclick = e => { e.stopPropagation(); truncate(stack.indexOf(b)); };
  // clicking the header of a blade that has others to its right closes those, like Azure
  $('.bh', el).onclick = e => { if (e.target.closest('button') || e.timeStamp <= (b.railAt||0)) return; const i = stack.indexOf(b); if (i < stack.length-1) truncate(i+1); };
  el.addEventListener('click', e => { if (!el.classList.contains('rail') || e.timeStamp <= (b.railAt||0) || e.target.closest('[data-id],[data-act]')) return; truncate(stack.indexOf(b)+1); });
  el.addEventListener('animationend', () => el.classList.remove('enter'), {once:true});
  stack.push(b); J.appendChild(el);
  def.mount && def.mount($('.bb', el), b);
  layout();
  return b;
}
function setHead(b, {title, sub, crumb}){
  if (title !== undefined){ b.title = title; $('.t', b.el).innerHTML = title; }
  if (crumb !== undefined) b.crumb = crumb;
  if (sub !== undefined) $('.s', b.el).innerHTML = sub;
  renderCrumbs();
}
function truncate(n, silent){
  if (n < 1) n = 1;
  const gone = stack.splice(n);
  gone.reverse().forEach(b => { b.alive = false; b.tok++; b.onClose && b.onClose(); b.el.remove(); });
  if (!silent) layout();
}
function layout(){
  const n = stack.length, last = stack[n-1];
  const modes = stack.map((b, i) => i === n-1 ? 'full' : (i < n-2 || last.wide) ? 'rail' : 'side');
  // not enough room for the blade beside the newest one: fold it too, rather than scroll it off screen
  const need = () => modes.reduce((a, md, i) => a + (md === 'rail' ? 52 : md === 'side' ? stack[i].side : md === 'narrow' ? stack[i].narrow : stack[i].min), 0);
  if (need() > J.clientWidth) modes.forEach((md, i) => { if (md === 'side' && stack[i].narrow) modes[i] = 'narrow'; });
  if (need() > J.clientWidth) modes.forEach((md, i) => { if (md === 'side' || md === 'narrow') modes[i] = 'rail'; });
  stack.forEach((b, i) => {
    const isLast = i === n-1;
    const mode = modes[i];
    const el = b.el, prev = b.mode; b.mode = mode;
    el.classList.toggle('rail', mode === 'rail'); el.classList.toggle('side', mode === 'side' || mode === 'narrow'); el.classList.toggle('narrow', mode === 'narrow'); el.classList.toggle('last', isLast);
    if (mode === 'rail') Object.assign(el.style, {width:'52px', minWidth:'52px', flex:'none'});
    else if (mode === 'narrow') Object.assign(el.style, {width:b.narrow+'px', minWidth:b.narrow+'px', flex:'none'});
    else if (isLast) Object.assign(el.style, {width:'auto', minWidth:b.min+'px', flex:'1 1 0'});
    else Object.assign(el.style, {width:b.side+'px', minWidth:b.side+'px', flex:'none'});
    $('.bh', el).title = mode === 'rail' ? `Back to ${b.crumb}` : mode === 'side' ? `Close what's open to the right` : '';
    if (prev !== mode && mode === 'rail') b.railAt = performance.now();
    if (prev !== mode && b.onMode) b.onMode(mode);
    b.sync && b.sync();
  });
  renderCrumbs();
  const top1 = stack[1] ? stack[1].type : '';
  $$('#tnav .tn').forEach(t => t.classList.toggle('on', t.dataset.nav === top1));
  requestAnimationFrame(() => J.scrollTo({left: J.scrollWidth, behavior: RM ? 'auto' : 'smooth'}));
}

          : `<div class="grid">${ms.map(cardHTML).join('')}<button class="card add" data-act="add">${ic('plus')}<span>Add a model</span><span class="mono" style="font-size:11px">mxc pull &lt;model&gt;</span></button></div>`}
      </div>`;
      const inp = $('.filter input', body);
      const applyQ = () => { const t = homeQ.trim().toLowerCase(); $$('[data-id]', body).forEach(r => r.style.display = !t || r.dataset.id.includes(t) ? '' : 'none'); };
      inp.oninput = () => { homeQ = inp.value; applyQ(); };
      applyQ();
      if (hadFocus) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    };
    b.redraw = draw; b.onMode = draw;
    b.sync = () => { const selId = stack[1] && stack[1].type === 'model' ? stack[1].opts.id : null; $$('[data-id]', body).forEach(r => r.classList.toggle('on', r.dataset.id === selId)); };
    b.el.addEventListener('click', e => {
      const a = e.target.closest('[data-act]');
      if (a) { e.stopPropagation(); const [k, v] = a.dataset.act.split(':');
        if (k === 'add') return openAdd();
        if (k === 'view') { view = v; try { localStorage.setItem('mxc-concept-d-view2', v); } catch(_){} return draw(); }
        if (k === 'restart') return startModel(byId(v));
        if (k === 'logs') { openModel(v); return push('logs', {id:v}, 1); }
      }
      const r = e.target.closest('[data-id]'); if (r) { e.stopPropagation(); openModel(r.dataset.id); }
    });
    body.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.id){ e.preventDefault(); openModel(e.target.dataset.id); } });
    draw();
  }});

/* ---------- a model: its own resource blade, with a menu and a command bar ---------- */
const MENU = [['overview','Overview','box'],['secure','Security','lock'],['bench','Benchmark','gauge'],['logs','Logs','scroll'],['notebook','Notebook','book']];
const HUE = {overview:'var(--network)', secure:'var(--keys)', bench:'var(--bench)', logs:'var(--logs)', notebook:'var(--learn)', copy:'var(--accent)', stop:'var(--warn)', start:'var(--ok)', rm:'var(--bad)'};
BLADES.model = b => {
  const m = byId(b.opts.id);
  return {title:`<span class="mdot" style="background:${m.color}"></span>${esc(m.id)}`, crumb:m.id, sub:`Model · ${esc(m.repo)}`, icon:'box', hue:m.color, side:660, narrow:470, min:620,
    mount(body, b){
      const child = () => stack[stack.indexOf(b)+1];
      const draw = () => {
        if (!models.includes(m)) return;
        const sc = $('.rcontent', body) ? $('.rcontent', body).scrollTop : 0;
        const run = m.state === 'running', on = live(m);
        const others = models.filter(x => x !== m && live(x));
        const pct = Math.round(m.vram/GPU.vram*100);
        const power = m.state==='running'||m.state==='starting' ? ['stop','stop','Stop'] : m.state==='crashed' ? ['start','rotate','Restart'] : ['start','play','Start'];
        body.innerHTML = `<div class="rwrap">
          <nav class="rmenu" aria-label="${esc(m.id)}">${MENU.map(([k,l,i],ix) => `${ix===1?'<div class="grp">Operate</div>':''}<button data-menu="${k}" style="--h:${HUE[k]}">${ic(i)}${l}${k!=='overview'?ic('chev','class="i chev"'):''}</button>`).join('')}
            <div class="grp">Command line</div><div style="padding:2px 10px">${cli(serveCli(m))}</div></nav>
          <div class="rcontent">
            <div class="cmdbar">
              <button class="cb" data-cmd="${power[0]}" style="--h:${HUE[power[0]]}">${ic(power[1])}${power[2]}</button>
              ${m.secure ? '' : `<button class="cb hl" data-cmd="secure" style="--h:var(--keys)">${ic('lock')}Make it secure</button>`}
              <button class="cb" data-cmd="bench" style="--h:${HUE.bench}">${ic('gauge')}Run benchmark</button>
              <button class="cb" data-cmd="notebook" style="--h:${HUE.notebook}">${ic('book')}Open notebook</button>
              <button class="cb" data-cmd="logs" style="--h:${HUE.logs}">${ic('scroll')}Logs</button>
              <span class="cbsep"></span>
              <button class="cb" data-cmd="copy" style="--h:${HUE.copy}">${ic('copy')}Copy endpoint</button>
              <button class="cb danger" data-cmd="rm">${ic('trash')}Remove</button>
            </div>
            <div class="ovgrid">
              ${m.state==='crashed'?`<div class="attn span" style="margin:0">${ic('alert')}<span>${esc(m.crash)}. Probably out of memory during a long prompt.</span><span class="grow"></span><button class="btn ghost" data-menu="logs">View logs</button></div>`:''}
              <section class="box span"><div class="h3">Essentials<span class="r">${stateHTML(m)}</span></div>
                <dl class="ess"><dt>Repository</dt><dd>${esc(m.repo)}</dd><dt>Architecture</dt><dd>${archName(m.arch)} · ${m.params}</dd>
                  <dt>Source</dt><dd>${m.src==='max'?'Modular MAX catalog':'Hugging Face'}${m.ported?' · ported':''}</dd><dt>Uptime</dt><dd>${run ? (m.req ? '3h 12m' : 'just now') : '—'}</dd>
                  <dt>Endpoint</dt><dd>${m.secure ? LAN : LOCAL}</dd><dt>Access</dt><dd>${m.secure ? 'HTTPS on your LAN, with a key' : `localhost only · <button class="lnk" data-menu="secure">make it secure</button>`}</dd>
                  <dt>GPU memory</dt><dd>${m.vram} GB · ${pct}% of ${GPU.vram} GB</dd><dt>Graph cache</dt><dd>~/.mxc/cache/graphs/${esc(m.id)}</dd></dl></section>
              <section class="box span"><div class="h3">Tokens · live<span class="r mono">${cli('mxc top ' + m.id)}</span></div>
                <div class="metrics"><div><div class="lbl">Throughput</div><div class="v"><span data-tps="${esc(m.id)}">${tpsNow(m)}</span> <small>tok/s</small></div></div><div><div class="lbl">First token</div><div class="v">${run?m.ttft+' <small>ms</small>':'—'}</div></div><div><div class="lbl">Requests · 1h</div><div class="v">${run?m.req.toLocaleString():0}</div></div></div>
                <div style="margin-top:12px">${sparkSvg(m, 600, 90, true)}</div></section>
              <section class="box"><div class="h3">Call it</div>

                ${keyRow(m)}
                <div class="code"><button class="cp" data-copy="${esc(curlFor(m, m.secure))}" data-label="curl copied">${ic('copy')}copy</button>${curlHTML(curlFor(m, m.secure))}</div></section>

                <div class="secsum">${sq('lock', m.secure?'var(--ok)':'var(--keys)')}<div class="tx"><b>${m.secure?'Secure on your network':'Localhost only'}</b><span>${m.secure?'HTTPS with a key. Other devices on your Wi-Fi can call it.':'Only this machine can call it. One click adds a certificate, a key and HTTPS.'}</span></div></div>
                <div style="margin-top:12px"><button class="btn ${m.secure?'ghost':'dark'}" data-menu="secure">${ic('lock')}${m.secure?'View security':'Make it secure'}</button></div>
                <div class="h3" style="margin-top:18px">Hardware fit<span class="r mono">${m.vram} GB</span></div>

                <div class="fitcap"><span>others ${others.reduce((a,x)=>a+x.vram,0).toFixed(1)} GB</span><span>${on?'free':'free if started'} ${(free() - (on?0:m.vram)).toFixed(1)} GB</span></div></section>
            </div>
          </div></div>`;
        wireKey(body, m);
        $('.rcontent', body).scrollTop = sc;
        sync();
      };
      const sync = () => { const c = child(); $$('.rmenu button', body).forEach(x => x.classList.toggle('on', c ? x.dataset.menu === c.type : x.dataset.menu === 'overview')); };
      const openChild = (k, extra={}) => {
        const c = child();
        if (k === 'overview') return truncate(stack.indexOf(b)+1);
        if (c && c.type === k && !extra.run) return;
        push(k, {id:m.id, ...extra}, stack.indexOf(b));
      };
      b.redraw = draw; b.sync = sync;
      body.addEventListener('click', e => {
        const mn = e.target.closest('[data-menu]'); if (mn) return openChild(mn.dataset.menu);
        const c = e.target.closest('[data-cmd]'); if (!c) return;
        const k = c.dataset.cmd;
        if (k === 'stop') { setState(m, 'idle'); toast(`Stopped ${m.id} · $ mxc stop ${m.id}`); return; }
        if (k === 'start') return startModel(m);
        if (k === 'secure') return openChild('secure', {run:true});
        if (k === 'bench') return openChild('bench', {run:true});
        if (k === 'notebook') return openChild('notebook');
        if (k === 'logs') return openChild('logs');
        if (k === 'copy') return copy(m.secure ? LAN : LOCAL, 'Endpoint copied');
        if (k === 'rm') {
          if (!c.dataset.confirm) { c.dataset.confirm = 1; c.innerHTML = `${ic('trash')}Click again to remove (${m.vram} GB)`; return; }
          models.splice(models.indexOf(m), 1); truncate(1); refreshAll(); toast(`Removed ${m.id} · $ mxc rm ${m.id}`);
        }
      });
      draw();
    }};
};

BLADES.bench = b => {
  const m = byId(b.opts.id);
  return {title:'Benchmark', crumb:'Benchmark', sub:`${esc(m.id)} · 256 tokens out · batch 1 · ${GPU.name}`, icon:'gauge', hue:'var(--bench)', side:560, min:560,
    tools:`<button class="btn ghost sm again">${ic('rotate','style="width:13px;height:13px"')}Run again</button>`,
    mount(body, b){
      const pool = models.filter(x => !x.hidden).concat([{id:'Qwen3-8B (ref)', tps:96, ttft:88, color:'#a1a1aa'}]).sort((a,c) => c.tps - a.tps);
      const max = Math.max(...pool.map(x => x.tps));
      const block = (key, unit, mx) => pool.map(x => `<div class="brow ${x===m?'me':''}"><span class="nm"><span class="mdot" style="background:${x.color}"></span>${esc(x.id)}</span><span class="tr"><span data-w="${x[key]/mx*100}" style="background:${x.color}"></span></span><span class="v" data-v="${x[key]} ${unit}">${x[key]} ${unit}</span></div>`).join('');
      body.innerHTML = `<div class="pad">
        <div class="h3">Decode speed · tokens/s<span class="r mono">higher is better</span></div><div class="bars">${block('tps','t/s',max)}</div>
        <div class="h3" style="margin-top:24px">Time to first token · ms<span class="r mono">lower is better</span></div><div class="bars">${block('ttft','ms',100)}</div>
        <div class="h3" style="margin-top:24px">This run</div>
        <dl class="ess"><dt>Prompts</dt><dd>64 · sharegpt-mini</dd><dt>This model</dt><dd>${m.tps} tok/s · p95 ${(256/m.tps*1.12).toFixed(2)} s · ${m.vram} GB peak</dd><dt>Compared with</dt><dd>every model on this GPU + a Qwen3-8B reference</dd></dl>
        <div style="margin-top:12px">${cli('mxc bench ' + m.id)}</div></div>`;
      const run = async () => {
        const tok = b.tok, mine = $$('.brow.me', body);
        $$('.tr span', body).forEach(s => { if (!s.closest('.me')) s.style.width = s.dataset.w + '%'; });
        mine.forEach(r => { $('.tr span', r).style.width = 0; $('.v', r).textContent = '…'; });
        toast(`$ mxc bench ${m.id} · 64 prompts`);
        await sleep(1400); if (!b.alive || tok !== b.tok) return;
        mine.forEach(r => { $('.tr span', r).style.width = $('.tr span', r).dataset.w + '%'; $('.v', r).textContent = $('.v', r).dataset.v; });
      };
      $('.again', b.el).onclick = run;
      if (b.opts.run) requestAnimationFrame(() => requestAnimationFrame(run));
      else requestAnimationFrame(() => requestAnimationFrame(() => $$('.tr span', body).forEach(s => s.style.width = s.dataset.w + '%')));
    }};
};

/* ---------- Logs (one model, or everything) ---------- */
BLADES.logs = b => {
  const m = b.opts.id ? byId(b.opts.id) : null;
  return {title: m ? 'Logs' : 'Logs · all models', crumb:'Logs', sub: m ? `${esc(m.id)} · max serve + gateway` : 'daemon, gateway and every model', icon:'scroll', hue:'var(--logs)', side:620, min:560,
    tools:`<button class="btn ghost sm pause">Pause</button>`,
    mount(body, b){
      body.style.display = 'flex'; body.style.flexDirection = 'column'; body.style.overflow = 'hidden';
      body.innerHTML = `<div class="log tall" role="log" style="flex:1;margin:0;border-radius:0;padding:12px 16px"></div><div style="padding:8px 16px;border-top:1px solid var(--card-line)">${cli(m ? `mxc logs ${m.id} -f` : 'mxc logs -f')}</div>`;
      const log = $('.log', body);
      const ids = m ? [m] : models.filter(x => x.state === 'running');
      const add = (tag, text, cls='') => { const d = document.createElement('div'); d.innerHTML = `<span class="t">${ts()}</span> <span class="k">${esc(tag)}</span> <span class="${cls}">${esc(text)}</span>`; log.appendChild(d); while (log.children.length > 300) log.firstChild.remove(); log.scrollTop = log.scrollHeight; };
      if (m && m.state === 'crashed') {
        ['INFO:     Uvicorn running on http://127.0.0.1:8005','POST /v1/chat/completions 200 · 412 tok · 0.8 s','max: prompt 31,204 tokens → kv cache grow','!CUDA error: out of memory (tried to allocate 1.9 GiB)','!worker exited with code 137','~supervisor: restart 1/2 … failed','~supervisor: restart 2/2 … failed · giving up'].forEach(l => add('serve', l.replace(/^[!~]/,''), l[0]==='!'?'er':l[0]==='~'?'wl':''));
        return;
      }
      if (m && m.state !== 'running') { add('serve', `${m.id} is ${m.state}. Start it to stream logs.`, 'wl'); return; }
      ['$ max serve --model-path '+(m?m.repo:'(gateway)'),'INFO:     Application startup complete.','+gateway route /v1 → '+(m?m.id:ids.map(x=>x.id).join(', '))].forEach(l => add(m?'serve':'gw', l.replace(/^[+$]/,''), l[0]==='+'?'okl':l[0]==='$'?'b':''));
      let paused = false;
      $('.pause', b.el).onclick = e => { paused = !paused; e.currentTarget.textContent = paused ? 'Resume' : 'Pause'; };
      const iv = setInterval(() => {
        if (!b.alive) return clearInterval(iv);
        if (paused || !ids.length) return;
        const x = ids[Math.floor(Math.random()*ids.length)], r = Math.random();
        if (r < .55) add(x.id.slice(0,10), `POST /v1/chat/completions 200 · ${Math.round(40+Math.random()*400)} tok · ${(0.2+Math.random()*1.6).toFixed(2)} s · key ${x.key.slice(0,8)}…`);
        else if (r < .8) add('max', `${x.id} batch=${1+Math.floor(Math.random()*6)} decode ${Math.round(x.data[x.data.length-1])} tok/s · kv ${Math.round(20+Math.random()*60)}%`);
        else if (r < .93) add('gw', `GET /v1/models 200 · ${models.filter(y=>y.state==='running').length} models`);
        else add('gw', 'request without key → 401 (as expected)', 'wl');
      }, 900);
    }};
};

/* ---------- Notebook (wide: the blades to its left fold into rails) ---------- */
BLADES.notebook = b => {

            : `<p>A decoder-only transformer: ${a.layers} layers, each doing attention and then a feed-forward step. It uses <b>grouped-query attention</b>: ${a.q} query heads share ${a.kv} key/value head${a.kv>1?'s':''}, which makes the KV cache ${a.q/a.kv}× smaller. ${a.extra}.</p><p>The diagram on the right is the whole model. The next cells talk to it through your endpoint.</p>`},

          md:`<p>The endpoint speaks the OpenAI API, so the official SDK works unchanged. The key comes from <span class="mono">MXC_API_KEY</span>.</p>`,
          code:`${K('import')} os\n${K('from')} openai ${K('import')} OpenAI\nclient = OpenAI(base_url=${S('"'+url+'"')},\n                api_key=os.environ[${S('"MXC_API_KEY"')}])\nr = client.chat.completions.create(model=${S('"'+esc(m.id)+'"')},\n      messages=[{${S('"role"')}: ${S('"user"')}, ${S('"content"')}: ${S('"Why is the sky blue?"')}}])\n${K('print')}(r.choices[0].message.content)`,
          out:'Sunlight scatters off air molecules, and shorter blue wavelengths scatter the most…'},
        {id:'config', title:'Read the config',
          md:`<p>Every number in the diagram comes from the model’s <span class="mono">config.json</span>. mxconsole loads it for you.</p>`,
          code:`${K('import')} mxc\ncfg = mxc.config(${S('"'+esc(m.id)+'"')})\n${ssm ? `cfg.n_layer, cfg.d_state, cfg.headdim  ${C('# no attention heads')}` : `cfg.num_attention_heads, cfg.num_key_value_heads  ${C('# the GQA ratio')}`}`,
          out: ssm ? `(${a.layers}, ${a.dstate}, ${a.headdim})` : `(${a.q}, ${a.kv})`},
        {id:'memory', title:'Memory as the prompt grows',
          md: ssm ? `<p>A state-space model carries the same state whatever the context length. Compare a 1k and a 32k prompt.</p>` : `<p>Every token in the context adds keys and values to the cache. Compare a 1k and a 32k prompt: this is why long contexts need VRAM.</p>`,
          code:`mxc.memory(${S('"'+esc(m.id)+'"')}, prompt_tokens=[1_000, 32_000])`,
          out: ssm ? 'state: 25 MB → 25 MB   (flat)' : `kv_cache: ${kvNow(1000)} MB → ${kvNow(32000)} MB`},
        {id:'speed', title:'Measure it yourself',
          md:`<p>Stream a response and time it. These are the same numbers the Benchmark blade reports.</p>`,
          code:`stats = mxc.time_stream(client, ${S('"'+esc(m.id)+'"')}, ${S('"Count to 50."')})\nstats.first_token_ms, stats.tokens_per_s`,
          out:`(${m.ttft}, ${m.tps})`},
      ];
      const diag = ssm
        ? `<div class="arch ssm"><div>embedding <span>${a.vocab} × ${a.d}</span></div><div>× ${a.layers} Mamba2 blocks <span>mixer + norm</span></div><div>in_proj → conv1d (k=4) <span>local mixing</span></div><div>SSD scan · state ${a.dstate} <span>chunk 256</span></div><div>RMSNormGated → out_proj <span>${a.d} d</span></div><div>lm_head <span>tied</span></div></div>`
        : `<div class="arch"><div>embed_tokens <span>${a.vocab} × ${a.d}</span></div><div>× ${a.layers} decoder layers <span>attn + mlp</span></div><div>self_attn · GQA <span>${a.q}q / ${a.kv}kv</span></div><div>mlp <span>${a.d} → ${a.ff}</span></div><div>RMSNorm → lm_head <span>logits</span></div></div>`;
      body.innerHTML = `<div class="nbbody">
          <nav class="nbtoc" aria-label="Chapters"><div class="lbl">Chapters</div>${ch.map((c,i) => `<button data-to="${c.id}"><span class="num">${i+1}</span>${c.title}</button>`).join('')}</nav>
          <div class="nbmain"><div class="inner">${ch.map((c,i) => `<section class="nbcell" data-sec="${c.id}">
              <div class="md"><h2>${i+1} · ${c.title}</h2>${c.md}</div>
              ${c.code ? `<div class="in"><div class="p"><button class="ib runc" aria-label="Run cell">${ic('play')}</button><span class="cnt">[ ]</span></div><div class="code">${c.code}</div></div>
              <div class="out wait" data-out="${esc(c.out)}">not run yet</div>` : ''}
            </section>`).join('')}</div></div>
          <aside class="nbside"><div class="lbl">Architecture</div>${diag}
            <dl class="kv" style="margin-top:14px"><dt>Layers</dt><dd>${a.layers}</dd><dt>Hidden</dt><dd>${a.d}</dd><dt>Vocab</dt><dd>${a.vocab}</dd><dt>On GPU</dt><dd>${m.vram} GB</dd><dt>Notes</dt><dd>${a.extra}</dd></dl>
            <div class="lbl" style="margin-top:16px">Open it in Jupyter</div><div style="margin-top:8px">${cli('jupyter lab ~/.mxc/learn/'+m.id+'.ipynb')}</div>
          </aside></div>`;
      const runCell = async sec => {
        const out = $('.out', sec); if (!out) return;
        if (m.state !== 'running') { toast(`Start ${m.id} first · $ ${serveCli(m)}`); return false; }
        $('.cnt', sec).textContent = '[*]'; out.textContent = 'running…';
        await sleep(600); if (!b.alive) return false;
        $('.cnt', sec).textContent = `[${++execCount}]`; out.classList.remove('wait'); out.textContent = out.dataset.out;
        return true;
      };
      $$('.runc', body).forEach(x => x.onclick = () => runCell(x.closest('.nbcell')));
      $('.nbrun', b.el).onclick = async () => { for (const s of $$('.nbcell', body)) { if (!$('.out', s)) continue; if (await runCell(s) === false) return; } toast(`Ran ${execCount} cells against ${m.id}`); };
      $$('.nbtoc button', body).forEach(x => x.onclick = () => $(`.nbcell[data-sec="${x.dataset.to}"]`, body).scrollIntoView({block:'start', behavior: RM ? 'auto' : 'smooth'}));
    }};
};

/* ---------- Add a model: search, then the full setup screen ---------- */
BLADES.add = b => ({title:'Add a model', crumb:'Add a model', sub:'Modular MAX catalog + Hugging Face · fit checked against your GPU', icon:'download', hue:'var(--pull)', wide:true, min:700,
  tools:`<button class="speed" aria-pressed="${fast}" title="Play the setup 4× faster">×4</button>`,
  mount(body, b){
    const sp = $('.speed', b.el); sp.classList.toggle('on', fast);
    sp.onclick = () => { fast = !fast; sp.classList.toggle('on', fast); sp.setAttribute('aria-pressed', fast); };
    b.onClose = () => { if (b.newModel && b.newModel.hidden) { b.newModel.hidden = false; toast(`${b.newModel.id} added to My models`); setTimeout(refreshAll); } };
    renderSearch(body, b);
  }});
function revealNew(b){ if (b.newModel) { b.newModel.hidden = false; refreshAll(); } }

function renderSearch(body, p){
  setHead(p, {title:'Add a model', crumb:'Add a model', sub:'Modular MAX catalog + Hugging Face · fit checked against your GPU'});
  p.src = p.src || 'all'; p.q = p.q || '';
  body.innerHTML = `<div class="findwrap"><div class="find">
      <label class="search">${ic('search')}<input placeholder="Search models — try qwen, llama, mamba" autocomplete="off" aria-label="Search models" value="${esc(p.q)}"></label>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="fseg" role="group" aria-label="Source">${[['all','All'],['max','MAX catalog'],['hf','Hugging Face']].map(([k,l]) => `<button data-s="${k}" class="${p.src===k?'on':''}">${l}</button>`).join('')}</div>
      <span class="cli" style="margin-top:10px">${GPU.name} · ${free().toFixed(1)} GB free · downloads cached in ~/.mxc/models</span></div>
      <div class="reslist results" role="list"></div></div></div>`;
  const draw = () => {
    const t = p.q.trim().toLowerCase();
    const list = CATALOG.filter(c => (p.src==='all' || c.src===p.src) && (!t || (c.repo + c.arch).toLowerCase().includes(t)));
    $('.results', body).innerHTML = list.length ? list.map(c => {
      const inst = models.find(m => m.id === c.id && !m.hidden), f = fitOf(c);
      const tag = inst ? `<span class="fit inst">installed · open</span>` : c.unsupported ? `<span class="fit port">port needed</span>` : f==='no' ? `<span class="fit no">won’t fit</span>` : c.cached ? `<span class="fit ok">downloaded · quick start</span>` : f==='ok' ? `<span class="fit ok">fits</span>` : `<span class="fit tight">tight</span>`;
      return `<button class="res" data-c="${c.id}" role="listitem"><span class="src ${c.src}">${c.src==='max'?'MX':'HF'}</span>
        <span class="nm">${esc(c.repo)}</span><span class="mt">${archName(c.arch)} · ${c.params}${c.sub?' · '+esc(c.sub):''}${c.unsupported?' · not in MAX yet':''}</span>
        <span class="fits">${tag}<span class="sz">${c.size} GB · needs ~${c.vram} GB</span></span></button>`;
    }).join('') : `<div class="empty">No match. Paste any Hugging Face repo id, e.g. org/model</div>`;
  };
  const q = $('input', body);
  q.oninput = () => { p.q = q.value; draw(); };
  q.onkeydown = e => { if (e.key === 'Enter') { const r = $('.res', body); r && r.click(); } };
  $('.fseg', body).onclick = e => { const x = e.target.closest('button'); if (!x) return; p.src = x.dataset.s; $$('.fseg button', body).forEach(y => y.classList.toggle('on', y===x)); draw(); };
  $('.results', body).onclick = e => { const r = e.target.closest('.res'); if (r) choose(body, p, CATALOG.find(c => c.id === r.dataset.c)); };
  draw();
  setTimeout(() => q.focus({preventScroll:true}), 250);
}
function choose(body, p, c){
  // already on this machine: no ceremony, show what it is
  if (models.find(m => m.id === c.id && !m.hidden)) { truncate(stack.indexOf(p)); openModel(c.id); toast(`${c.id} is already set up · showing it`); return; }
  if (c.unsupported) return renderPortOffer(body, p, c);
  runServe(body, p, c);
}
const backLink = `<button class="backlink back">${ic('back')}Back to search</button>`;
function setupHTML(cmd, stages){
  return `<div class="setup"><div class="sl">${backLink}
      <div class="runhead"><span class="cmd">$ ${esc(cmd)}</span><span class="total">00:00.0</span></div>
      ${stagesHTML(stages)}<div class="after"></div></div>
    <div class="sr"><div class="lbl">${ic('term','style="width:13px;height:13px"')}Detailed log<span class="last" style="display:none"></span></div><div class="log" role="log"></div></div></div>`;
}
async function runServe(body, p, c){
  const tok = ++p.tok;
  setHead(p, {title:`Setting up ${esc(c.id)}`, crumb:c.id, sub:`<span class="mono">mxc pull ${esc(c.repo)} && mxc serve ${esc(c.id)}</span>${c.cached?' · weights already downloaded':''}`});
  const stages = serveStages(c);
  body.innerHTML = setupHTML(`mxc serve ${c.id}`, stages);
  $('.back', body).onclick = () => { p.tok++; renderSearch(body, p); };
  const t0 = performance.now();
  for (let i = 0; i < stages.length; i++) {
    const r = await runStage(body, p, tok, i, stages[i], t0);
    if (r === null) return;
    if (r === 'fail') return renderHwWarn(body, p, c);
  }
  const vr = fitOf(c) === 'tight' ? +(free() - 0.4).toFixed(1) : c.vram;
  const m = mk({id:c.id, repo:c.repo, src:c.src, arch:c.arch, params:c.params, vram:vr, color:PALETTE[colorIx++ % PALETTE.length], state:'running', secure:false, tps:c.tps, ttft:Math.round(9000/c.tps), req:0, hidden:true});
  models.push(m); p.newModel = m; c.cached = true;
  renderHW();
  showReady(body, p, m, 'Your endpoint is live.');
}
function showReady(body, p, m, headline, extra=''){
  setHead(p, {title:`${esc(m.id)} is ready`, sub:`<span class="mono">${LOCAL}</span> · model “${esc(m.id)}”`});
  $('.back', body) && $('.back', body).remove();
  const a = $('.after', body);
  a.innerHTML = `<div class="ready" role="status">
      <span class="pill">READY · LOCALHOST</span>
      <h4>${headline}</h4>${extra}
      <div class="urlrow"><span class="tag">local</span><span class="u">${LOCAL}</span><button class="ib" data-copy="${LOCAL}" aria-label="Copy URL">${ic('copy')}</button></div>
      ${keyRow(m)}
      <div class="secbox" style="margin-top:12px"></div>
      <div class="acts"><button class="btn primary open">Open ${esc(m.id)}${ic('chev','style="width:14px;height:14px"')}</button><button class="btn ghost done">Done</button><span class="cli" style="margin-left:auto">mxc ls</span></div>
    </div>`;
  wireKey(a, m);
  secureBox($('.secbox', a), m, p);
  $('.done', a).onclick = () => truncate(stack.indexOf(p));
  $('.open', a).onclick = () => { revealNew(p); truncate(stack.indexOf(p)); openModel(m.id); };
  a.firstElementChild.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
}
function renderHwWarn(body, p, c){
  const a8 = CATALOG.find(x => x.id === 'qwen3-8b'), awq = CATALOG.find(x => x.id === 'qwen3-32b-awq');
  setHead(p, {title:'This one won’t fit', crumb:c.id, sub:`<span class="mono">mxc pull ${esc(c.repo)}</span> · refused before download`});
  $('.after', body).innerHTML = `<div class="notice warn" style="margin-top:14px">
      <div class="lab">${ic('alert')} HARDWARE CHECK · nothing downloaded</div>
      <h4>${esc(c.repo.split('/')[1])} needs ~${c.vram} GB. You have ${GPU.vram} GB.</h4>
      <p>At bf16 the weights alone are ${c.size} GB. mxconsole checks before downloading ${c.size} GB you can’t use.</p>
      <div class="meter"><span>needs</span><span class="tr"><i style="width:100%;background:var(--bad)"></i></span><span>~${c.vram} GB</span></div>
      <div class="meter"><span>RTX 4090</span><span class="tr"><i style="width:${GPU.vram/c.vram*100}%;background:var(--models)"></i></span><span>${GPU.vram} GB</span></div>
      <div class="sugg">
        ${[[a8,'Same family and tokenizer. ~96 tok/s here.'],[awq,'4-bit AWQ of the same model. Slower, tight fit.']].map(([x,d]) => `<button class="sg" data-c="${x.id}"><span class="t">${esc(x.repo)}</span><span class="fit ${fitOf(x)}">${fitOf(x)==='ok'?'fits':'tight'} · ~${x.vram} GB</span><span class="d">${d}</span>${cli('mxc pull ' + x.repo)}</button>`).join('')}
      </div>
    </div>`;
  $('.notice', body).scrollIntoView({block:'start', behavior: RM ? 'auto' : 'smooth'});
  $$('.sg', body).forEach(x => x.onclick = () => runServe(body, p, CATALOG.find(y => y.id === x.dataset.c)));
}
function renderPortOffer(body, p, c){
  setHead(p, {title:'Not supported by MAX yet', crumb:c.id, sub:`${esc(c.repo)} · ${c.arch}`});
  body.innerHTML = `<div class="findwrap"><div class="find">${backLink}<div class="notice port">
      <div class="lab">${ic('hammer')} ARCHITECTURE CHECK</div>
      <h4>${esc(c.repo)} uses <span class="mono" style="font-weight:500">${c.arch}</span>, which MAX can’t run yet.</h4>
      <p>“Port it” runs Modular agent skills: read the config, import the model into a MAX graph, test it against the reference, and fix what fails. You’ll see every step.</p>
      <dl class="kv"><dt>arch</dt><dd>${c.arch} · state-space, no attention</dd><dt>size</dt><dd>${c.params} · ${c.size} GB · fits (~${c.vram} GB)</dd><dt>skills</dt><dd>import-model, debug-parity</dd><dt>est. time</dt><dd>~6 min on this GPU</dd></dl>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn port go">${ic('hammer')}Port it</button><span class="cli" style="margin-left:auto">mxc port ${esc(c.repo)}</span></div>
    </div></div></div>`;
  $('.go', body).onclick = () => runPort(body, p, c);
  $('.back', body).onclick = () => renderSearch(body, p);
}
async function runPort(body, p, c){
  const tok = ++p.tok, H = 'var(--models)';
  setHead(p, {title:`Porting ${esc(c.id)}`, crumb:'Port it', sub:`<span class="mono">mxc port ${esc(c.repo)}</span> · Modular agent skills`});
  const stages = [
    {name:'Read config', tag:'read', hue:H, hint:'config.json + modeling code', active:'parsing', dur:1300, doneNote:'48 layers · d_state 128 · SSD scan',
      log:['fetch config.json, modeling_mamba2.py (2.7 GB weights deferred)', 'arch=Mamba2ForCausalLM d_model=2048 n_layer=48 d_state=128 headdim=64', '~no attention layers: selective state-space (SSD) scan', 'mapped 7 of 9 ops to existing MAX kernels; 2 need new graph code']},
    {name:'Import model', skill:'import-model', tag:'skill', hue:H, hint:'modular/skills/import-model', active:'translating modules', dur:2800, doneNote:'Mamba2Block, RMSNormGated generated', meter:p=>`${Math.round(p*9)} / 9 modules`,
      log:['$skill import-model v0.3 · reading modeling_mamba2.py', 'module Mamba2RMSNormGated → max.nn (new, 24 lines)', 'module Mamba2Mixer → in_proj, conv1d, ssd_scan, out_proj', 'conv1d(kernel=4, groups=4096) → ops.conv1d', 'ssd_scan → writing Mojo kernel from reference (chunked, chunk=256)', 'weights: 386 tensors renamed', '+import-model done · 3 files in ~/.mxc/ports/mamba2-1.3b/']},
    {name:'Write graph', tag:'graph', hue:H, hint:'pipeline + compile', active:'compiling', dur:2300, doneNote:'compiled · 298 ops', meter:p=>`${Math.round(p*298)} / 298 ops`,
      log:['register pipeline arch "Mamba2ForCausalLM"', 'building graph: embed → 48× Mamba2Block → norm_f → lm_head', 'compiling to sm_89 …', '+graph compiled in 44.8s']},
    {name:'Test parity', tag:'parity', hue:H, hint:'vs. PyTorch reference', active:'comparing logits on 32 prompts', dur:2400, failAt:0.62, failNote:'max |Δ| 3.1e-2 > 1e-3 at layer 12', meter:p=>`${Math.round(p*32)} / 32 prompts`,
      log:['reference: transformers 4.46, fp32, cpu', 'prompt 1-8: max |Δ logits| 4.1e-5 ok', 'prompt 9-16: max |Δ logits| 3.8e-5 ok'],
      failLog:['prompt 17: max |Δ logits| 3.1e-2 FAIL (tolerance 1e-3)', 'first divergence: layer 12 mixer.ssd_scan, seq_len 300 > chunk 256', 'parity-check FAILED · handing to debug-parity']},
    {name:'Fix', skill:'debug-parity', tag:'fix', hue:'var(--warn)', hint:'waiting for parity', active:'bisecting', dur:3000, doneNote:'state carried across scan chunks · re-test 32/32',
      log:['$skill debug-parity · hypothesis 1: dtype drift in A_log exp() … no (fp32 already)', 'hypothesis 2: state not carried between scan chunks … reproduced at seq_len 257', 'patch ssd_scan.mojo: pass final_state of chunk k into chunk k+1 (+6 −1 lines)', 'recompile graph (cached ops reused) 9.3s', 're-run parity: 32/32 prompts', '+max |Δ logits| 5.2e-5 · all within 1e-3', '+fix recorded in ~/.mxc/ports/mamba2-1.3b/FIXES.md']},
    {name:'Serve', tag:'serve', hue:'var(--network)', hint:'localhost', active:'warming up', dur:1400, doneNote:LOCAL,
      log:['$max serve --custom-architectures ~/.mxc/ports/mamba2-1.3b', 'INFO:     Application startup complete.', '+gateway route /v1 → mamba2-1.3b']},
  ];
  body.innerHTML = setupHTML(`mxc port ${c.repo}`, stages);
  $('.back', body).onclick = () => { p.tok++; renderSearch(body, p); };
  const t0 = performance.now();
  for (let i = 0; i < stages.length; i++) {
    const r = await runStage(body, p, tok, i, stages[i], t0);
    if (r === null) return;
    if (i === 4) { const tp = $('.stg[data-i="3"]', body); setRing(tp, 'fixed'); $('.d', tp).textContent = 'failed once · fixed by debug-parity'; $('.bar i', tp).style.width = '100%'; }
  }
  const m = mk({id:c.id, repo:c.repo, src:c.src, arch:c.arch, params:c.params, vram:c.vram, color:PALETTE[colorIx++ % PALETTE.length], state:'running', secure:false, tps:c.tps, ttft:31, req:0, hidden:true, ported:true});
  models.push(m); p.newModel = m; renderHW();
  showReady(body, p, m, 'Ported, tested and live.', `<p style="margin:-4px 0 12px;color:var(--muted);font-size:13px">The skills wrote 3 files and 1 kernel, failed parity once and patched it (<span class="mono">FIXES.md</span>). Next time it’s a normal serve.</p>`);
}

addEventListener('resize', () => { clearTimeout(layout.h); layout.h = setTimeout(layout, 120); });
/* ---------- boot ---------- */
push('home');
renderHW();
setTimeout(() => startModel(Object.assign(byId('gemma-3-1b'), {state:'idle'})), 400);
})();
</script>
