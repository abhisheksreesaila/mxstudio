[workspace]
authors = ["Abhishek Sreesaila <abhisheksreesaila@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mxstudio"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.1"

[tasks]
studio = "PYTHONPATH=notebooks python -m mxstudio.cli ui"
mxstudio = "PYTHONPATH=notebooks python -m mxstudio.cli"
# Backward-compatible short alias.
mxs = "PYTHONPATH=notebooks python -m mxstudio.cli"

[dependencies]
modular = ">=26.5.0.dev2026080106,<27"
openai = ">=2.52.0,<3"
numpy = ">=2.5.1,<3"
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
nbformat = ">=5.11.1,<6"
jupyterlab = ">=4.6.4,<5"
pytest-timeout = ">=2.4.0,<3"

[pypi-dependencies]
fh-saas = ">=0.9.14, <0.10"
mxconsole = { path = ".", editable = true }

[feature.gateway.dependencies]
python = "3.12.*"

[feature.gateway.pypi-dependencies]
litellm = { version = ">=1.80", extras = ["proxy"] }

[environments]
gateway = { features = ["gateway"], no-default-feature = true }
